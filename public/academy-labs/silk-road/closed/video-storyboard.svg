<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 625" role="img" aria-labelledby="title"><title id="title">Предложение, продукт, получаване и заявка</title><rect width="940" height="625" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="30" y="45" font-size="28" fill="#172033" font-weight="700">Четири кадъра с различна работа</text><rect x="30" y="80" width="430" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="52" y="117" font-size="22" fill="#172033" font-weight="700">1 · Предложение</text><circle cx="78" cy="165" r="10" fill="#b45309"/><circle cx="108" cy="165" r="10" fill="#b45309"/><circle cx="138" cy="165" r="10" fill="#b45309"/><circle cx="168" cy="165" r="10" fill="#b45309"/><circle cx="78" cy="193" r="10" fill="#b45309"/><circle cx="108" cy="193" r="10" fill="#b45309"/><circle cx="138" cy="193" r="10" fill="#b45309"/><circle cx="168" cy="193" r="10" fill="#b45309"/><circle cx="78" cy="221" r="10" fill="#b45309"/><circle cx="108" cy="221" r="10" fill="#b45309"/><circle cx="138" cy="221" r="10" fill="#b45309"/><circle cx="168" cy="221" r="10" fill="#b45309"/><text x="210" y="180" font-size="25" fill="#172033" font-weight="400">12 хапки</text><text x="210" y="225" font-size="23" fill="#172033" font-weight="400">18 €</text><rect x="485" y="80" width="430" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="507" y="117" font-size="22" fill="#172033" font-weight="700">2 · Какво получаваш</text><text x="520" y="180" font-size="25" fill="#172033" font-weight="400">Съдържание</text><text x="520" y="225" font-size="23" fill="#172033" font-weight="400">на кутията</text><rect x="30" y="325" width="430" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="52" y="362" font-size="22" fill="#172033" font-weight="700">3 · Получаване</text><text x="65" y="425" font-size="25" fill="#172033" font-weight="400">Вземане</text><text x="65" y="470" font-size="23" fill="#172033" font-weight="400">от обекта</text><rect x="485" y="325" width="430" height="220" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="507" y="362" font-size="22" fill="#172033" font-weight="700">4 · Следваща стъпка</text><text x="520" y="425" font-size="25" fill="#172033" font-weight="400">Изпрати заявка</text><text x="520" y="470" font-size="23" fill="#172033" font-weight="400">Чака потвърждение</text><text x="30" y="595" font-size="20" fill="#475569" font-weight="400">Учебен сториборд · условията не са реална търговска оферта</text></g></svg>