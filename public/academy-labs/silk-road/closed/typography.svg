<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-labelledby="title"><title id="title">Две визуални йерархии за една и съща оферта</title><rect width="940" height="500" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif"><text x="30" y="45" font-size="26" fill="#172033" font-weight="700">Едни и същи условия, различна йерархия</text><rect x="30" y="80" width="430" height="350" rx="16" fill="#ffffff" stroke="#cbd5e1"/><rect x="480" y="80" width="430" height="350" rx="16" fill="#ffffff" stroke="#cbd5e1"/><text x="55" y="119" font-size="21" fill="#172033" font-weight="400">А · Важно условие е скрито</text><text x="505" y="119" font-size="21" fill="#172033" font-weight="400">Б · Условието е до цената</text><text x="55" y="180" font-size="28" fill="#172033" font-weight="400">Диагностика</text><text x="55" y="272" font-size="72" fill="#172033" font-weight="700">25 €</text><text x="55" y="311" font-size="12" fill="#a1a1aa" font-weight="400">Ремонтът се уточнява отделно.</text><text x="505" y="180" font-size="28" fill="#172033" font-weight="400">Диагностика</text><text x="505" y="232" font-size="38" fill="#172033" font-weight="700">25 €</text><text x="505" y="279" font-size="25" fill="#172033" font-weight="400">Ремонтът се уточнява</text><text x="505" y="312" font-size="25" fill="#172033" font-weight="400">отделно.</text><rect x="55" y="355" width="290" height="50" rx="16" fill="#1d4ed8" stroke="#1d4ed8"/><text x="74" y="389" font-size="22" fill="#fff" font-weight="400">Заяви диагностика</text><rect x="505" y="355" width="290" height="50" rx="16" fill="#1d4ed8" stroke="#1d4ed8"/><text x="524" y="389" font-size="22" fill="#fff" font-weight="400">Заяви диагностика</text><text x="30" y="475" font-size="20" fill="#475569" font-weight="400">Учебна схема · не е тест с реални посетители</text></g></svg>