name: Academy security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-academy-distribution.mjs
        env:
          ACADEMY_COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
  browser-video:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm run build
        env:
          VITE_PUBLIC_SUPABASE_URL: https://dashboard-fixture.supabase.co
          VITE_PUBLIC_SUPABASE_ANON_KEY: dashboard-test-public-key
      - run: npm run test:browser
      - run: npm run test:dashboard-browser
      - run: npm run test:themes-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-browser-checks
          path: |
            test-results/video/
            test-results/dashboard/
            test-results/themes/
          retention-days: 14
