name: Academy security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:edge
      - run: npm run build
  browser-video:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perfect-video-browser-checks
          path: test-results/video/
          retention-days: 14
